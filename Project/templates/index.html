<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FWI Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(to right, #1e3c72, #2a5298);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      }

      .title {
        font-weight: bold;
        text-align: center;
        margin-bottom: 25px;
      }

      .btn-custom {
        background-color: #ff9800;
        border: none;
        font-weight: bold;
        width: 100%;
        padding: 10px;
        border-radius: 10px;
      }

      .btn-custom:hover {
        background-color: #e68900;
      }

      .form-control {
        border-radius: 10px;
      }

      .prediction {
        margin-top: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: green;
      }

      label {
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2 class="title">🔥 Forest Fire Weather Index Prediction</h2>

        <form action="{{ url_for('predict_datapoint')}}" method="post">
          <div class="mb-3">
            <label for="Temperature">Temperature (°C)</label>
            <input
              type="number"
              step="any"
              name="Temperature"
              class="form-control"
              id="Temperature"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Rh">Relative Humidity (%)</label>
            <input
              type="number"
              step="any"
              name="Rh"
              class="form-control"
              id="Rh"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Ws">Wind Speed (km/h)</label>
            <input
              type="number"
              step="any"
              name="Ws"
              class="form-control"
              id="Ws"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Rain">Rain (mm)</label>
            <input
              type="number"
              step="any"
              name="Rain"
              class="form-control"
              id="Rain"
              required
            />
          </div>

          <div class="mb-3">
            <label for="FFMC">FFMC</label>
            <input
              type="number"
              step="any"
              name="FFMC"
              class="form-control"
              id="FFMC"
              required
            />
          </div>

          <div class="mb-3">
            <label for="DMC">DMC</label>
            <input
              type="number"
              step="any"
              name="DMC"
              class="form-control"
              id="DMC"
              required
            />
          </div>

          <div class="mb-3">
            <label for="DC">DC</label>
            <input
              type="number"
              step="any"
              name="DC"
              class="form-control"
              id="DC"
              required
            />
          </div>

          <div class="mb-3">
            <label for="ISI">ISI</label>
            <input
              type="number"
              step="any"
              name="ISI"
              class="form-control"
              id="ISI"
              required
            />
          </div>

          <div class="mb-3">
            <label for="BUI">BUI</label>
            <input
              type="number"
              step="any"
              name="BUI"
              class="form-control"
              id="BUI"
              required
            />
          </div>

          <div class="mb-3">
            <label for="Classes">Classes (0 or 1)</label>
            <input
              type="number"
              step="any"
              name="Classes"
              class="form-control"
              id="Classes"
              required
            />
          </div>

          <button type="submit" class="btn btn-custom">Predict FWI</button>
        </form>

        {% if prediction_text %}
        <div class="prediction">
          The FWI prediction is: {{ prediction_text }}
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
